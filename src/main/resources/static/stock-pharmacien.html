<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var theme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Pharmacie — Stock</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="apple-touch-icon" href="favicon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="croix" aria-hidden="true">
            <img src="logo-pharmacie.png" alt="Logo pharmacie" width="30" height="30">
        </div>
        <div>
            <h1>Gestion Pharmacie</h1>
            <p class="soustitre" data-i18n="stockPharmSousTitre">Consultation du stock · lecture seule</p>
        </div>
        <div class="etat-api" id="etatApi">
            <span class="pastille"></span>
            <span id="etatApiTexte">Vérification de l'API…</span>
        </div>
        <button type="button" id="btnToggleLangue" class="btn-theme btn-langue" aria-label="Changer de langue / Switch language" title="Français / English">FR</button>
        <button type="button" id="btnToggleTheme" class="btn-theme" aria-label="Changer de thème" title="Mode sombre / clair">
            <svg class="icone-soleil" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icone-lune" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <div class="session">
            <p id="userInfo"></p>
            <button id="btnLogout" hidden>Déconnexion</button>
        </div>
    </header>

    <main class="grille">

        <div class="page-header">
            <div>
                <p class="etiquette" data-i18n="etiquetteStock">STOCK</p>
                <h2 class="page-titre" data-i18n="stockPharmTitrePage">Stock des médicaments</h2>
                <p class="page-description" data-i18n="stockPharmDescriptionPage">Consultation en lecture seule des quantités disponibles et des seuils critiques.</p>
            </div>
        </div>

        <section class="carte carte-large" data-role="PHARMACIEN">
            <p class="etiquette" data-i18n="etiquetteStock">STOCK</p>
            <h2 data-i18n="medListeTitre">Liste des médicaments</h2>
            <button type="button" id="btnListeMedicaments" data-i18n="btnActualiserListe">Actualiser la liste</button>
            <div class="tableau-conteneur">
                <table class="tableau" id="tableMedicaments" hidden>
                    <thead>
                        <tr>
                            <th data-i18n="colId">ID</th>
                            <th data-i18n="colNom">Nom</th>
                            <th data-i18n="colDosage">Dosage</th>
                            <th data-i18n="colStock">Stock</th>
                            <th data-i18n="colPrixDT">Prix (DT)</th>
                            <th data-i18n="colSeuil">Seuil</th>
                            <th data-i18n="colPeremption">Péremption</th>
                        </tr>
                    </thead>
                    <tbody id="corpsTableMedicaments"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="ui.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
