<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var theme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Pharmacie — Commandes</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="apple-touch-icon" href="favicon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="croix" aria-hidden="true">
            <img src="logo-pharmacie.png" alt="Logo pharmacie" width="30" height="30">
        </div>
        <div>
            <h1>Gestion Pharmacie</h1>
            <p class="soustitre" data-i18n="commandesSousTitre">Réapprovisionnement fournisseur · API REST</p>
        </div>
        <div class="etat-api" id="etatApi">
            <span class="pastille"></span>
            <span id="etatApiTexte">Vérification de l'API…</span>
        </div>
                        <button type="button" id="btnToggleLangue" class="btn-theme btn-langue" aria-label="Changer de langue / Switch language" title="Français / English">FR</button>
        <button type="button" id="btnToggleTheme" class="btn-theme" aria-label="Changer de thème" title="Mode sombre / clair">
            <svg class="icone-soleil" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icone-lune" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <div class="session">
            <p id="userInfo"></p>
            <button id="btnLogout" hidden>Déconnexion</button>
        </div>
    </header>

    <main class="grille">

        <div class="page-header">
            <div>
                <p class="etiquette" data-i18n="etiquetteCommandes">COMMANDES</p>
                <h2 class="page-titre" data-i18n="commandesTitrePage">Commandes</h2>
                <p class="page-description" data-i18n="commandesDescriptionPage">Réapprovisionnement auprès des fournisseurs pour les médicaments en stock bas.</p>
            </div>
        </div>

<section class="carte carte-large" data-role="GESTIONNAIRE">
		            <p class="etiquette" data-i18n="etiquetteCommandes">COMMANDES</p>
		            <h2 data-i18n="commandesCreerTitre">Créer une commande</h2>
		            <form id="formCommande">
		                <div class="rangee rangee-3">
		                    <label data-i18n="champIdGestionnaire">ID Gestionnaire
		                        <input type="number" name="idGestionnaire" required min="1" placeholder="1">
		                    </label>
		                    <label data-i18n="champIdMedicament">ID Médicament
		                        <input type="number" name="idMedicament" required min="1" placeholder="1">
		                    </label>
		                    <label data-i18n="champQuantite">Quantité
		                        <input type="number" name="quantite" required min="1" placeholder="50">
		                    </label>
		                </div>
		                <div class="rangee">
		                    <label data-i18n="champFournisseur">Fournisseur
		                        <select name="idFournisseur" id="selectFournisseur">
		                            <option value="" data-i18n="optNonPrecise">— Non précisé —</option>
		                        </select>
		                    </label>
		                    <label data-i18n="champDatePeremptionLot">Date de péremption du lot reçu (facultatif)
		                        <input type="date" name="datePeremption">
		                    </label>
		                </div>
		                <button type="submit" data-i18n="btnCreerCommande">Créer la commande</button>
		            </form>
		            <p class="alerte" id="alerteCommande" hidden></p>
		        </section>
    </main>

    <script src="ui.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
